<svg xmlns="http://www.w3.org/2000/svg" width="480" height="473" viewBox="0 0 480 473" role="img" aria-labelledby="title" aria-describedby="desc" focusable="false">
  <title id="title">Dashboard ramp shells</title>
  <desc id="desc">The dashboard draws seven striped shells A through G from the original ramp models. Ramp A is shown in detail with its placeholder body. Content maps store.ramps using ramp.id as the React key. Each RampBox receives the model itself and uses the existing Ramp.scss.</desc>
  <style>
    svg { font: 20px system-ui, "DejaVu Sans", sans-serif; fill: #f5f4ef; }
    .title { font-size: 28px; font-weight: 750; letter-spacing: -.5px; }
    .label { font-size: 22px; font-weight: 700; }
    .muted { fill: #bbcbdc; }
    .cyan { fill: #69dcf5; }
    .code { font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace; }
    .surface { fill: #20354c; stroke: #52718f; }
    .line { fill: none; stroke: #52718f; stroke-width: 2; }
    .route { fill: none; stroke: #69dcf5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1b2d42"/>
      <path d="M0 0v12" stroke="#2a415a" stroke-width="8"/>
    </pattern>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#69dcf5"/>
    </marker>
  </defs>
  <rect width="480" height="473" rx="16" fill="#142235"/>
  <text x="28" y="47" class="title">Dashboard ramp shells</text>
  <rect x="28" y="71" width="424" height="50" rx="8" class="surface"/>
  <text x="48" y="103" class="code cyan">store.ramps</text>
  <text x="432" y="103" text-anchor="end" class="muted">7 models</text>
  <path d="M240 121v27" class="route" marker-end="url(#tip)"/>
  <rect x="28" y="152" width="424" height="117" rx="10" fill="url(#stripes)" stroke="#69dcf5"/>
  <path d="M38 152h404a10 10 0 0 1 10 10v32H28v-32a10 10 0 0 1 10-10z" fill="#254359"/>
  <text x="48" y="181" class="label">A</text>
  <text x="432" y="181" text-anchor="end" class="code muted">key="001"</text>
  <text x="240" y="239" text-anchor="middle">Loadings will appear here.</text>
  <g fill="url(#stripes)" stroke="#52718f">
    <rect x="28" y="283" width="132" height="76" rx="7"/>
    <rect x="174" y="283" width="132" height="76" rx="7"/>
    <rect x="320" y="283" width="132" height="76" rx="7"/>
    <rect x="28" y="371" width="132" height="76" rx="7"/>
    <rect x="174" y="371" width="132" height="76" rx="7"/>
    <rect x="320" y="371" width="132" height="76" rx="7"/>
  </g>
  <path d="M28 319h132m14 0h132m14 0h132M28 407h132m14 0h132m14 0h132" class="line"/>
  <g text-anchor="middle" class="label">
    <text x="94" y="310">B</text>
    <text x="240" y="310">C</text>
    <text x="386" y="310">D</text>
    <text x="94" y="398">E</text>
    <text x="240" y="398">F</text>
    <text x="386" y="398">G</text>
  </g>
</svg>
