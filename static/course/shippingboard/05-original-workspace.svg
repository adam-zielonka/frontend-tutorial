<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438" role="img" aria-labelledby="title" aria-describedby="desc" focusable="false">
  <title id="title">Start from the original app</title>
  <desc id="desc">The mini board’s three React records give way to the original app’s eleven MobX loadings. Start at commit 3634bcb9a1ee, create lesson/ramp-dashboard, and carry that checkout from the baseline build through lesson 5.15.</desc>
