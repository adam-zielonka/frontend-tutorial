<svg xmlns="http://www.w3.org/2000/svg" width="480" height="406" viewBox="0 0 480 406" role="img" aria-labelledby="title" aria-describedby="desc" focusable="false">
  <title id="title">Inside the first loading card</title>
  <desc id="desc">The temporary card for 0007701 shows Militech, today’s 06:00–09:00 window, and a full bar for 2 of 2 pallets. LoadingBox reads the model’s date, customer and pallet values. loadedRatio supplies 1 to the progress bar. This first fixture is temporarily rendered in every ramp.</desc>
  <style>
    svg { font: 20px system-ui, "DejaVu Sans", sans-serif; fill: #f5f4ef; }
    .title { font-size: 28px; font-weight: 750; letter-spacing: -.5px; }
    .label { font-size: 22px; font-weight: 700; }
    .muted { fill: #bbcbdc; }
    .cyan { fill: #69dcf5; }
    .amber { fill: #ffbe65; }
    .code { font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace; }
    .surface { fill: #20354c; stroke: #52718f; }
    .line { fill: none; stroke: #52718f; stroke-width: 2; }
  </style>
  <rect width="480" height="406" rx="16" fill="#142235"/>
  <text x="28" y="47" class="title">Inside the first loading card</text>
  <rect x="28" y="73" width="254" height="266" rx="11" class="surface"/>
  <rect x="28" y="73" width="254" height="50" rx="11" fill="#254359"/>
  <text x="49" y="106" class="code label cyan">0007701</text>
  <text x="49" y="153" class="muted">Today (local)</text>
  <text x="49" y="180" class="code">06:00–09:00</text>
  <text x="49" y="220" class="label">Militech</text>
  <text x="49" y="247" class="muted">US, Washington, D.C.</text>
  <text x="49" y="273" class="code muted">771996</text>
  <path d="M45 285h220" class="line"/>
  <text x="49" y="312" class="label">2 of 2</text>
  <rect x="49" y="321" width="212" height="7" rx="3.5" fill="#82dfaa"/>
  <path d="M266 166h31m-31 64h31m-31 94h31" class="line"/>
  <g fill="#69dcf5">
    <circle cx="297" cy="166" r="3.5"/>
    <circle cx="297" cy="230" r="3.5"/>
    <circle cx="297" cy="324" r="3.5"/>
  </g>
  <text x="309" y="160" class="code cyan">start</text>
  <text x="309" y="185" class="code cyan">end</text>
  <text x="309" y="236" class="code cyan">customer</text>
  <text x="309" y="294" class="code amber">picked</text>
  <text x="309" y="317" class="code amber">÷ pallets</text>
  <text x="309" y="340" class="code amber">= 1</text>
