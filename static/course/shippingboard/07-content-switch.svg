<svg xmlns="http://www.w3.org/2000/svg" width="480" height="412" viewBox="0 0 480 412" role="img" aria-labelledby="title" aria-describedby="desc" focusable="false">
  <title id="title">Switch only Content</title>
  <desc id="desc">Inside App, Content branches to the original loadings table or the dashboard placeholder. Header and Details sit outside the branch. The observing Content reads ui.isLoadingsOpen. Details stays mounted so a table row can still open the shared dialog.</desc>
  <style>
    svg { font: 20px system-ui, "DejaVu Sans", sans-serif; fill: #f5f4ef; }
    .title { font-size: 28px; font-weight: 750; letter-spacing: -.5px; }
    .label { font-size: 22px; font-weight: 700; }
    .muted { fill: #bbcbdc; }
    .cyan { fill: #69dcf5; }
    .amber { fill: #ffbe65; }
    .code { font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace; }
    .surface { fill: #20354c; stroke: #52718f; }
    .line { fill: none; stroke: #52718f; stroke-width: 2; }
    .route { fill: none; stroke: #69dcf5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="480" height="412" rx="16" fill="#142235"/>
  <text x="28" y="47" class="title">Switch only Content</text>
  <rect x="28" y="70" width="424" height="316" rx="12" fill="#192b40" stroke="#52718f"/>
  <rect x="44" y="85" width="392" height="40" rx="7" class="surface"/>
  <text x="58" y="112" class="code">App / Header</text>
  <rect x="44" y="136" width="392" height="183" rx="8" fill="#1c334b" stroke="#69dcf5"/>
  <text x="58" y="165" class="label">Content</text>
  <text x="422" y="165" text-anchor="end" class="code cyan">ui.isLoadingsOpen</text>
  <path d="M319 173v14M144 201v-14h192v14" class="route"/>
  <text x="135" y="223" text-anchor="middle" class="code cyan">true</text>
  <text x="345" y="223" text-anchor="middle" class="code amber">false</text>
  <rect x="57" y="231" width="171" height="72" rx="6" class="surface"/>
  <rect x="251" y="231" width="172" height="72" rx="6" class="surface"/>
  <text x="143" y="257" text-anchor="middle" class="label">Loadings</text>
  <path d="M76 270h134v22H76zM76 280h134m-96-10v22m55-22v22" class="line"/>
  <text x="337" y="258" text-anchor="middle" class="muted">Ramps will</text>
  <text x="337" y="285" text-anchor="middle" class="muted">appear here.</text>
  <rect x="44" y="330" width="392" height="40" rx="7" class="surface"/>
  <text x="58" y="357" class="code">Details</text>
  <text x="422" y="357" text-anchor="end" class="muted">keeps its place</text>
</svg>
