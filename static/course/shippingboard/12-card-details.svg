<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-labelledby="title" aria-describedby="desc" focusable="false">
  <title id="title">One shared dialog</title>
  <desc id="desc">The dashboard card and table row for 0007703 open the same Details dialog. Moving it from C to A changes both presentations. Both click handlers pass the same Loading instance to openLoadingDialog. The selection also writes loading=0007703 to the URL.</desc>
  <style>
    svg { font: 20px system-ui, "DejaVu Sans", sans-serif; fill: #f5f4ef; }
    .title { font-size: 28px; font-weight: 750; letter-spacing: -.5px; }
    .label { font-size: 22px; font-weight: 700; }
    .muted { fill: #bbcbdc; }
    .cyan { fill: #69dcf5; }
    .amber { fill: #ffbe65; }
    .code { font-family: ui-monospace, Consolas, "DejaVu Sans Mono", monospace; }
    .surface { fill: #20354c; stroke: #52718f; }
    .line { fill: none; stroke: #52718f; stroke-width: 2; }
    .route { fill: none; stroke: #69dcf5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#69dcf5"/>
    </marker>
  </defs>
  <rect width="480" height="455" rx="16" fill="#142235"/>
  <text x="28" y="47" class="title">One shared dialog</text>
  <rect x="28" y="72" width="197" height="78" rx="9" class="surface"/>
  <rect x="255" y="72" width="197" height="78" rx="9" class="surface"/>
  <text x="45" y="102" class="label">Card on C</text>
  <text x="272" y="102" class="label">Table row</text>
  <text x="45" y="131" class="code cyan">0007703</text>
  <text x="272" y="131" class="code cyan">0007703</text>
  <path d="M140 150v22h200v-22m-100 22v22" class="route" marker-end="url(#tip)"/>
  <rect x="82" y="200" width="316" height="113" rx="10" fill="#20354c" stroke="#69dcf5"/>
  <path d="M82 240h316" class="line"/>
  <text x="100" y="228" class="label">Details · 0007703</text>
  <path d="m369 214 12 12m0-12-12 12" class="line"/>
  <text x="100" y="281">Ramp</text>
  <rect x="177" y="254" width="55" height="42" rx="6" class="surface"/>
  <rect x="251" y="254" width="55" height="42" rx="6" fill="#254359" stroke="#69dcf5"/>
  <text x="204" y="282" text-anchor="middle" class="label">A</text>
  <text x="278" y="282" text-anchor="middle" class="label cyan">C</text>
  <text x="345" y="280" text-anchor="middle" class="muted">…</text>
  <path d="M240 313v30H126m114 0h114" class="route"/>
  <text x="240" y="341" text-anchor="middle" class="amber" paint-order="stroke" stroke="#142235" stroke-width="9">Choose A</text>
  <path d="M126 343v28" class="route" marker-end="url(#tip)"/>
  <path d="M354 343v28" class="route" marker-end="url(#tip)"/>
  <rect x="28" y="376" width="197" height="51" rx="8" class="surface"/>
  <rect x="255" y="376" width="197" height="51" rx="8" class="surface"/>
  <text x="126" y="409" text-anchor="middle" class="label">Card on A</text>
  <text x="354" y="409" text-anchor="middle" class="label">Row shows A</text>
</svg>
