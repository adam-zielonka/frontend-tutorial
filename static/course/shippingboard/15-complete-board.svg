<svg xmlns="http://www.w3.org/2000/svg" width="480" height="492" viewBox="0 0 480 492" role="img" aria-labelledby="title" aria-describedby="desc" focusable="false">
  <title id="title">7 ramps, 11 loadings</title>
  <desc id="desc">After reload, the dashboard shows eight assigned cards across seven ramps. The Loadings table also includes the three unassigned records. Open 0007703 from either view and move or clear it in Details. The dashboard and table update together. Reloading restores the fixture assignments, and a deep link can reopen the table and dialog.</desc>
