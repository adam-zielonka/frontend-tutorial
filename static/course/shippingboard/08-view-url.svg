<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title desc">
<title id="title">Restore first, react to later changes</title>
<desc id="desc">URL at startup: view + loading ID → UI.init: Resolve models first → reaction: State → URL. Loading links, unrelated query parameters and the hash survive. No popstate router.</desc>
<rect width="880" height="260" rx="12" fill="#f4f6f8"/>
<g font-family="system-ui, sans-serif" fill="#182026">
<text x="24" y="36" font-size="21" font-weight="700">Restore first, react to later changes</text>
<rect x="24" y="64" width="258" height="105" rx="8" fill="#fff" stroke="#526779"/>
<text x="40" y="103" font-size="18" font-weight="600">URL at startup</text>
<text x="40" y="136" font-size="15">view + loading ID</text>
<path d="M287 116h18m-6-6 6 6-6 6" fill="none" stroke="#315b7a" stroke-width="2"/>
<rect x="310" y="64" width="258" height="105" rx="8" fill="#fff" stroke="#526779"/>
<text x="326" y="103" font-size="18" font-weight="600">UI.init</text>
<text x="326" y="136" font-size="15">Resolve models first</text>
<path d="M573 116h18m-6-6 6 6-6 6" fill="none" stroke="#315b7a" stroke-width="2"/>
<rect x="596" y="64" width="258" height="105" rx="8" fill="#fff" stroke="#526779"/>
<text x="612" y="103" font-size="18" font-weight="600">reaction</text>
<text x="612" y="136" font-size="15">State → URL</text>
</g></svg>
