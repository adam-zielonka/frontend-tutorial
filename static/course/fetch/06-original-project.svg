<svg xmlns="http://www.w3.org/2000/svg" width="640" height="478" viewBox="0 0 640 478" role="img" aria-labelledby="title desc">
  <title id="title">Start from the pinned ShippingBoard checkpoint</title>
  <desc id="desc">Clone create-fetch into shippingboard-fetch, detach at bdd5494f80b7, and create my-fetch-work there. Install from the historical lockfile with pnpm 7, then run pnpm dev and verify the original board opens.</desc>
  <rect width="640" height="478" rx="22" fill="#142235"/>
  <g font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#fbf4e8">
    <text x="42" y="51" font-weight="650">shippingboard-lite</text>
    <text x="598" y="51" text-anchor="end" fill="#69dcf5">Archived source</text>
    <path d="M28 68h584" stroke="#456078" stroke-width="2"/>
    <path d="M50 96v130" fill="none" stroke="#69dcf5" stroke-width="3"/>
    <circle cx="50" cy="96" r="7" fill="#69dcf5"/>
    <circle cx="50" cy="158" r="8" fill="#ffbe65"/>
    <circle cx="50" cy="226" r="7" fill="#69dcf5"/>
    <text x="77" y="104" font-family="SFMono-Regular, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">create-fetch</text>
    <text x="598" y="104" text-anchor="end">Branch to clone</text>
    <text x="77" y="166" font-family="SFMono-Regular, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" fill="#ffbe65">bdd5494f80b7</text>
    <text x="598" y="166" text-anchor="end">Pinned commit</text>
    <text x="77" y="234" font-family="SFMono-Regular, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">my-fetch-work</text>
    <text x="598" y="234" text-anchor="end">New local branch</text>
    <path d="M50 233v24m-7-8 7 8 7-8" fill="none" stroke="#69dcf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="269" width="584" height="122" rx="13" fill="#20354b" stroke="#456078" stroke-width="2"/>
    <text x="48" y="301" fill="#69dcf5">In <tspan font-family="SFMono-Regular, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">shippingboard-fetch</tspan></text>
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="23">
      <text x="48" y="336">pnpm dlx pnpm@7.33.7 install \</text>
      <text x="68" y="369">--frozen-lockfile</text>
      <text x="48" y="438" fill="#ffbe65">pnpm dev</text>
    </g>
    <path d="M177 430h48m-7-7 7 7-7 7" fill="none" stroke="#69dcf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="246" y="438">Original board opens</text>
  </g>
</svg>
