<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 315" role="img" aria-labelledby="title desc">
  <title id="title">Inspect a click in the debugger</title>
  <desc id="desc">Example starting at 42. Execution pauses inside add before the assignment; this.value is still 42. Resuming the action changes the clicked counter to 43.</desc>
  <style>
    text {font: 18px system-ui, sans-serif; fill: #eef6ff}
    .label {font-size: 15px; font-weight: 650; fill: #adbfce}
    .name {font-size: 23px; font-weight: 650}
    .code {font: 18px ui-monospace, monospace; fill: #89e6f7}
    .key {font-size: 23px; font-weight: 700; fill: #ffbe65}
  </style>
  <rect x="0" y="0" width="420" height="315" rx="16" fill="#142235"/>
  <text x="24" y="39" class="name">A click on +1</text>
  <text x="24" y="68" class="body">Starting value: 42</text>
  <rect x="24" y="90" width="372" height="130" rx="10" fill="#20364b"/>
  <text x="43" y="119" class="label">Store.ts   /   paused</text>
  <rect x="32" y="138" width="354" height="48" rx="5" fill="#142235"/>
<circle cx="50" cy="162" r="7" fill="#ffbe65"/>
  <text x="65" y="169" class="code" style="font-size:16px">const next = this.value + delta</text>
  <text x="44" y="207" class="code">this.value: 42  ·  delta: 1</text>
  <path d="M43 230v34m-6-6 6 6 6-6" fill="none" stroke="#69dcf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="65" y="253" class="label">Resume execution</text>
  <text x="24" y="297" class="key">Counter displays 43</text>
</svg>
